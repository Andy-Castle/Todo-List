<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
  </head>
  <body>
    <main>
      <header>
        <h1>Todo List</h1>
      </header>
      <section>
        <div class="menu">
          <div class="newTodo">
            <dialog>
              <div class="close-area">
                <button autofocus>X</button>
              </div>
              <form onsubmit="return false">
                <ul>
                  <li>
                    <label for="title">Title</label>
                    <br />
                    <input type="text" name="title" id="title" required />
                  </li>
                  <li>
                    <label for="description">Description</label>
                    <br />
                    <input
                      type="text"
                      name="description"
                      id="description"
                      required />
                  </li>
                  <button id="add">Add</button>
                </ul>
              </form>
            </dialog>
            <button class="new-todo-button">New ToDo</button>
          </div>
          <footer>
            <a
              href="https://github.com/Andy-Castle/Todo-List---Trello-Base-it.git"
              target="_blank">
              <img
                src="Public/github-mark-white.svg"
                alt="GitHub logo to access to my profile" />
              &copy; Andy-Castle
            </a>
          </footer>
        </div>
      </section>
    </main>
  </body>
</html>
